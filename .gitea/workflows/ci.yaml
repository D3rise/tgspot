name: CI

on: [push, workflow_dispatch, pull_request]

jobs:
  pipeline:
    uses: nerv/ci/.gitea/workflows/rust.yaml@main

    with:
      image: d3rise/tgspot
      registry: registry.nerv.dev
      system_packages: ffmpeg

      autodeploy: true
      gitops_repository: nerv/gitops
      gitops_path: nerv-apps/manifests/tgspot

    secrets: inherit