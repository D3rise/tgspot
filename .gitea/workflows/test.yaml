
name: MAGI Runner Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Verify MAGI runner
    runs-on: magi

    steps:
      - name: System information
        run: |
          echo "Hello from MAGI!"
          uname -a
          cat /etc/os-release

      - name: Verify environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Repository: $GITHUB_REPOSITORY"

      - name: Test execution
        run: |
          echo "NERV CI/CD operational"
