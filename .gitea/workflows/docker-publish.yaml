
name: Build and Push to Image Registry

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  publish:
    runs-on: magi

    env:
      REGISTRY: registry.nerv.dev
      IMAGE: d3rise/tgspot

      SSL_CERT_FILE: /tmp/magi-ca.crt
      GIT_SSL_CAINFO: /tmp/magi-ca.crt
      NODE_EXTRA_CA_CERTS: /tmp/magi-ca.crt

    steps:
      - name: Install MAGI CA
        env:
          MAGI_CA_CERT: ${{ secrets.MAGI_CA_CERT }}
        run: |
          printf '%s\n' "$MAGI_CA_CERT" > /tmp/magi-ca.crt
          chmod 644 /tmp/magi-ca.crt

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker info

      - name: Login to Registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "REGISTRY_PASSWORD" | \
            docker login "$REGISTRY" \
              --username "REGISTRY_USERNAME" \
              --password-stdin

      - name: Build image
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE:latest" \
            -t "$REGISTRY/$IMAGE:$GITHUB_SHA" \
            .

      - name: Push image
        run: |
          docker push "$REGISTRY/$IMAGE:latest"
          docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"

      - name: Verify push
        run: |
          docker manifest inspect \
            "$REGISTRY/$IMAGE:$GITHUB_SHA" > /dev/null

          echo "Image published successfully"
