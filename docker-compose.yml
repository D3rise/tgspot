services:
  tg-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_STAT: 0
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  tgspot:
    build: .
    restart: unless-stopped
    depends_on:
      tg-bot-api:
        condition: service_started
    env_file: .env
    environment:
      TELEGRAM_BOT_API_ROOT: http://tg-bot-api:8081
    volumes:
      - ./credentials.json:/data/credentials.json:ro

volumes:
  tg-bot-api-data:
