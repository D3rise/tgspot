[package]
name = "tgspot"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Telegram music bot powered by librespot and Yandex Music"

[dependencies]
aes = "0.8"
anyhow = "1"
ctr = "0.9"
base64 = "0.22"
futures-util = "0.3"
hmac = "0.12"
librespot-audio = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
